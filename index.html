<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#090b10"><title>Daily Routine</title><style>
:root{--bg:#090b10;--card:#12151c;--line:#252b36;--text:#f4f7fb;--muted:#8d96a6;--a:#9cff57;--danger:#ffcc66}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:radial-gradient(circle at 90% 0,#25321c,transparent 28%),radial-gradient(circle at 0 40%,#172033,transparent 30%),var(--bg);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,sans-serif}.app{max-width:620px;margin:auto;padding:18px 17px 70px}header{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px}h1{font-size:29px;margin:0}.date{color:var(--muted);font-size:14px;margin-top:4px;cursor:pointer}.ha{display:flex;align-items:center;gap:8px}.streak{background:#171c17;border:1px solid #304028;color:#d8ffbf;border-radius:13px;padding:9px 10px;font-size:12px;font-weight:800;white-space:nowrap}.add{width:46px;height:46px;border:0;border-radius:15px;background:var(--a);color:#081006;font-size:28px;cursor:pointer}.date-strip{display:flex;gap:10px;overflow-x:auto;overscroll-behavior-x:contain;scroll-snap-type:x mandatory;padding:2px 2px 12px;margin-bottom:10px;-ms-overflow-style:none;scrollbar-width:none}.date-strip::-webkit-scrollbar{display:none}.day-card{flex:0 0 82px;height:82px;background:#202a38;border:1px solid #344154;border-radius:18px;color:var(--text);display:flex;flex-direction:column;align-items:center;justify-content:center;scroll-snap-align:center;cursor:pointer;transition:.18s}.day-card .dow{font-size:12px;color:#b8c0cd;letter-spacing:.5px}.day-card .num{font-size:22px;font-weight:900;margin-top:4px}.day-card.selected{background:#2c5871;border-color:#23d6a4;box-shadow:0 0 0 1px #23d6a4}.day-card.selected .dow{color:#eefdf8}.date-tools{display:flex;justify-content:center;align-items:center;gap:7px;margin:-2px 0 14px}.date-tools button{border:1px solid var(--line);background:#12151c;color:var(--muted);border-radius:10px;padding:6px 9px;font-size:11px}.deadlines{margin-bottom:21px}.deadline-head{display:flex;justify-content:space-between;align-items:center;margin:0 2px 10px}.deadline-head strong{font-size:17px}.deadline-head span{font-size:12px;color:var(--muted)}.deadline-list{background:#12151ce8;border:1px solid var(--line);border-radius:20px;overflow:hidden}.deadline-item{display:flex;align-items:center;gap:12px;padding:14px 13px;border-bottom:1px solid var(--line)}.deadline-item:last-child{border:0}.deadline-dot{width:12px;height:12px;border-radius:50%;background:var(--danger);box-shadow:0 0 0 5px #ffcc6617;flex:none}.deadline-body{flex:1;min-width:0;cursor:pointer}.deadline-title{font-size:14px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.deadline-time{font-size:12px;color:var(--muted);margin-top:3px}.deadline-more,.more{border:0;background:none;color:#8b94a2;font-size:22px;cursor:pointer;padding:5px 2px}.deadline-empty{text-align:center;padding:14px;color:var(--muted);font-size:12px}.deadline-empty b{color:var(--text)}.progress{background:linear-gradient(145deg,#151922,#0f1218);border:1px solid var(--line);border-radius:20px;padding:17px;margin-bottom:21px}.pr{display:flex;justify-content:space-between;align-items:end}.label,.count{color:var(--muted);font-size:13px}.pct{font-size:31px;font-weight:900}.bar{height:9px;background:#252a34;border-radius:99px;overflow:hidden;margin-top:12px}.fill{height:100%;width:0;background:var(--a);transition:.25s}.dh{display:flex;justify-content:space-between;margin:4px 2px 10px}.dh strong{font-size:17px}.dh span{font-size:12px;color:var(--muted)}.list{background:#12151ce8;border:1px solid var(--line);border-radius:20px;overflow:hidden}.item{display:flex;align-items:center;gap:12px;padding:15px 13px;border-bottom:1px solid var(--line)}.item:last-child{border:0}.check{width:25px;height:25px;border:2px solid #4d5665;border-radius:8px;flex:none;cursor:pointer}.done .check{background:var(--a);border-color:var(--a)}.done .check:after{content:'✓';display:block;text-align:center;color:#071006;font-weight:900}.body{flex:1;min-width:0;cursor:pointer}.title{font-size:15px;font-weight:750;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.time{font-size:12px;color:var(--muted);margin-top:3px}.empty{text-align:center;padding:35px 20px;color:var(--muted)}.empty b{display:block;color:var(--text);margin-bottom:6px}.hint{text-align:center;color:#667181;font-size:11px;margin-top:11px}.modal{position:fixed;inset:0;background:#000b;display:none;align-items:flex-end;padding:10px;z-index:5}.modal.show{display:flex}.sheet{width:min(620px,100%);margin:auto;background:#12151c;border:1px solid #2a303b;border-radius:24px;padding:20px}.sheet h2{margin:0 0 15px}.choice{display:flex;gap:10px}.choice button,.actions button,.menu button{width:100%;padding:14px;border-radius:13px;font-weight:800;cursor:pointer}.choice button{background:#191d25;color:var(--text);border:1px solid var(--line)}label{display:block;color:var(--muted);font-size:12px;font-weight:750;margin-top:10px}input,select{width:100%;padding:13px;margin-top:6px;background:#0d1015;color:var(--text);border:1px solid #303744;border-radius:12px;font:inherit}.row{display:flex;gap:10px}.row>div{flex:1}.actions{display:flex;gap:10px;margin-top:16px}.primary{background:var(--a);color:#081006;border:0}.secondary{background:#191d25;color:var(--text);border:1px solid #303744}.small{color:var(--muted);font-size:11px;margin-top:8px}.menu{display:grid;gap:9px}.menu button{border:1px solid var(--line);background:#191d25;color:var(--text);text-align:left}.menu .delete{color:#ff9f9f}.calendar-input{position:absolute;opacity:0;pointer-events:none;width:1px;height:1px}
</style></head><body><div class="app"><header><div><h1>Daily Routine</h1><div class="date" id="date" title="Tap to choose a date"></div></div><div class="ha"><div class="streak">🔥 <span id="streak">0</span> day streak</div><button class="add" id="add">+</button></div></header><input class="calendar-input" id="calendar" type="date"><div class="date-strip" id="dateStrip"></div><div class="date-tools"><button id="todayBtn">Today</button><button id="prevBtn">‹</button><button id="nextBtn">›</button></div><section class="deadlines"><div class="deadline-head"><strong>Deadlines</strong><span id="deadlineCount"></span></div><div class="deadline-list" id="deadlineList"></div></section><section class="progress"><div class="pr"><div><div class="label">Today's Progress</div><div class="pct" id="pct">0%</div></div><div class="count" id="count">0/0 completed</div></div><div class="bar"><div class="fill" id="fill"></div></div></section><div class="dh"><strong id="day"></strong><span id="n"></span></div><div class="list" id="list"></div><div class="hint">Weekly tasks repeat automatically. Changes can be made for one date or for every week.</div></div><div class="modal" id="modal"><div class="sheet" id="sheet"></div></div>
<script>
const K='routineV3',oldK='dailyRoutineV1',W=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
let D=new Date();D.setHours(0,0,0,0);let selected=new Date(D);
let S=JSON.parse(localStorage.getItem(K)||'null');
if(!S){let o=JSON.parse(localStorage.getItem(oldK)||'null');S={tasks:[],done:{},deadlines:[]};if(o?.tasks)S.tasks=o.tasks.map((x,i)=>({id:'old'+x.id,title:x.name,start:x.time||'',end:'',weekday:3,repeat:true,order:i,date:null}));}
S.tasks??=[];S.done??={};S.deadlines??=[];save();
const $=id=>document.getElementById(id),esc=x=>String(x).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
function pad(n){return String(n).padStart(2,'0')}function dateKey(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}function parseKey(k){let [y,m,d]=k.split('-').map(Number);let x=new Date(y,m-1,d);x.setHours(0,0,0,0);return x}function same(a,b){return dateKey(a)===dateKey(b)}
function save(){localStorage.setItem(K,JSON.stringify(S))}
function fmtTime(v){if(!v)return '';let [h,m]=v.split(':').map(Number);let ap=h>=12?'PM':'AM';let hh=h%12||12;return hh+':'+pad(m)+' '+ap}
function fmtDate(k){let d=parseKey(k);return new Intl.DateTimeFormat('en-IN',{day:'numeric',month:'short',year:'numeric'}).format(d)}
function done(id){return !!S.done[dateKey(selected)]?.[id]}function toggle(id){let k=dateKey(selected);S.done[k]??={};S.done[k][id]=!S.done[k][id];save();render()}
function close(){ $('modal').classList.remove('show') }
function open(){ $('sheet').innerHTML='<h2>Add something</h2><div class="choice"><button onclick="taskForm()">＋ Routine task</button><button onclick="deadlineForm()">＋ Deadline</button></div><div class="actions"><button class="secondary" onclick="close()">Cancel</button></div>'; $('modal').classList.add('show') }
function taskForm(id='',forceDate=false){
 let t=S.tasks.find(x=>x.id===id);let isRecurring=t?.repeat&&!t?.date;let defaultScope=(t&&isRecurring)?'date':'date';
 $('sheet').innerHTML=`<h2>${t?'Edit':'Add'} routine task</h2><label>What do you need to do?</label><input id="name" value="${t?esc(t.title):''}" placeholder="e.g. Study"><div class="row"><div><label>Start</label><input id="start" type="time" value="${t?.start||''}"></div><div><label>End</label><input id="end" type="time" value="${t?.end||''}"></div></div><label>Save for</label><select id="scope"><option value="date" selected>This date only — ${fmtDate(dateKey(selected))}</option><option value="week">Every ${W[selected.getDay()]} — repeat weekly</option></select><div class="small">Editing a weekly task for one date creates a separate exception; the normal weekly schedule stays unchanged.</div><div class="actions"><button class="secondary" onclick="close()">Cancel</button><button class="primary" onclick="saveTask('${id}')">Save</button></div>`;$('modal').classList.add('show')
}
function saveTask(id){let title=$('name').value.trim();if(!title)return;let start=$('start').value,end=$('end').value,scope=$('scope').value,k=dateKey(selected);let old=S.tasks.find(x=>x.id===id);
 if(id&&old&&old.repeat&&!old.date&&scope==='date'){S.tasks.push({id:'t'+Date.now(),title,start,end,weekday:selected.getDay(),repeat:false,order:Date.now(),date:k,source:id});}
 else if(id){Object.assign(old,{title,start,end,weekday:selected.getDay(),repeat:scope==='week',date:scope==='week'?null:k,order:old.order??Date.now()});}
 else S.tasks.push({id:'t'+Date.now(),title,start,end,weekday:selected.getDay(),repeat:scope==='week',order:Date.now(),date:scope==='week'?null:k});
 save();close();render()}
function deadlineForm(id=''){let d=S.deadlines.find(x=>x.id===id);$('sheet').innerHTML=`<h2>${d?'Edit':'Add'} deadline</h2><label>Deadline for</label><input id="dn" value="${d?esc(d.title):''}" placeholder="e.g. Submit assignment"><div class="row"><div><label>Date</label><input id="dd" type="date" value="${d?.date||dateKey(selected)}"></div><div><label>Time</label><input id="dt" type="time" value="${d?.time||'23:59'}"></div></div><div class="actions"><button class="secondary" onclick="close()">Cancel</button><button class="primary" onclick="saveDeadline('${id}')">Save</button></div>`;$('modal').classList.add('show')}
function saveDeadline(id){let title=$('dn').value.trim();if(!title)return;let o={title,date:$('dd').value,time:$('dt').value};if(id)Object.assign(S.deadlines.find(x=>x.id===id),o);else S.deadlines.push({id:'d'+Date.now(),...o});save();close();render()}
function actionMenu(type,id){let title=type==='task'?'Routine task':'Deadline';$('sheet').innerHTML=`<h2>${title}</h2><div class="menu"><button onclick="close();${type==='task'?'taskForm(\''+id+'\')':'deadlineForm(\''+id+'\')'}">✎ Edit</button><button class="delete" onclick="${type==='task'?'deleteTask':'deleteDeadline'}('${id}')">⌫ Delete</button><button class="secondary" onclick="close()">Cancel</button></div>`;$('modal').classList.add('show')}
function deleteTask(id){$('sheet').innerHTML='<h2>Delete routine task?</h2><div class="small">This will remove this task from its saved schedule.</div><div class="actions"><button class="secondary" onclick="close()">Cancel</button><button class="delete primary" onclick="delTaskNow(\''+id+'\')">Delete</button></div>'}
function delTaskNow(id){S.tasks=S.tasks.filter(x=>x.id!==id);save();close();render()}
function deleteDeadline(id){$('sheet').innerHTML='<h2>Delete deadline?</h2><div class="actions"><button class="secondary" onclick="close()">Cancel</button><button class="delete primary" onclick="delDeadlineNow(\''+id+'\')">Delete</button></div>'}
function delDeadlineNow(id){S.deadlines=S.deadlines.filter(x=>x.id!==id);save();close();render()}
function streak(){let n=0,d=new Date(D);for(let i=0;i<366;i++){let k=dateKey(d),ts=S.tasks.filter(t=>(t.repeat&&!t.date&&t.weekday===d.getDay())||t.date===k);if(!ts.length||!ts.every(t=>S.done[k]?.[t.id]))break;n++;d.setDate(d.getDate()-1)}return n}
function visibleTasks(){let k=dateKey(selected);return S.tasks.filter(t=>(t.repeat&&!t.date&&t.weekday===selected.getDay())||t.date===k)}
function renderStrip(){let center=new Date(selected);let cards=[];for(let i=-3;i<=3;i++){let d=new Date(center);d.setDate(d.getDate()+i);cards.push(d)}$('dateStrip').innerHTML=cards.map(d=>`<button class="day-card ${same(d,selected)?'selected':''}" data-k="${dateKey(d)}"><span class="dow">${W[d.getDay()].slice(0,3).toUpperCase()}</span><span class="num">${d.getDate()}</span></button>`).join('');$('dateStrip').querySelectorAll('.day-card').forEach(b=>b.onclick=()=>selectDate(parseKey(b.dataset.k)));setTimeout(()=>{let el=$('dateStrip').querySelector('.selected');if(el)el.scrollIntoView({behavior:'smooth',block:'nearest',inline:'center'})},0)}
function selectDate(d){d.setHours(0,0,0,0);selected=d;render()}
function renderDeadlines(){let k=dateKey(D);let ds=S.deadlines.filter(d=>d.date>=k).sort((a,b)=>(a.date+' '+(a.time||'99:99')).localeCompare(b.date+' '+(b.time||'99:99')));$('deadlineCount').textContent=ds.length?ds.length+' upcoming':'';$('deadlineList').innerHTML='';if(!ds.length){$('deadlineList').innerHTML='<div class="deadline-empty"><b>No upcoming deadlines</b> · Tap + to add one</div>';return}ds.forEach(d=>{let r=document.createElement('div');r.className='deadline-item';r.innerHTML=`<div class="deadline-dot"></div><div class="deadline-body"><div class="deadline-title">${esc(d.title)}</div><div class="deadline-time">${fmtDate(d.date)} · ${fmtTime(d.time)}</div></div><button class="deadline-more">⋮</button>`;r.querySelector('.deadline-body').onclick=()=>deadlineForm(d.id);r.querySelector('.deadline-more').onclick=()=>actionMenu('deadline',d.id);$('deadlineList').appendChild(r)})}
function render(){let k=dateKey(selected);$('date').textContent=new Intl.DateTimeFormat('en-IN',{weekday:'long',month:'long',day:'numeric',year:'numeric'}).format(selected);$('day').textContent=W[selected.getDay()];renderStrip();renderDeadlines();let ts=visibleTasks(),arr=ts.map(x=>({s:x.start||'99:99',x})).sort((a,b)=>a.s.localeCompare(b.s));$('n').textContent=ts.length+' routine'+(ts.length===1?'':'s');$('list').innerHTML='';if(!arr.length)$('list').innerHTML='<div class="empty"><b>No routine yet</b>Tap + to add your first task.</div>';arr.forEach(a=>{let x=a.x,r=document.createElement('div');r.className='item '+(done(x.id)?'done':'');r.innerHTML=`<div class="check"></div><div class="body"><div class="title">${esc(x.title)}</div><div class="time">${fmtTime(x.start)}${x.end?' to '+fmtTime(x.end):''}${x.date&&!x.repeat?' · This date only':''}</div></div><button class="more">⋮</button>`;r.querySelector('.check').onclick=()=>toggle(x.id);r.querySelector('.body').onclick=()=>taskForm(x.id);r.querySelector('.more').onclick=()=>actionMenu('task',x.id);$('list').appendChild(r)});let c=ts.filter(t=>done(t.id)).length,p=ts.length?Math.round(c/ts.length*100):0;$('pct').textContent=p+'%';$('count').textContent=c+'/'+ts.length+' completed';$('fill').style.width=p+'%';$('streak').textContent=streak();save()}
$('add').onclick=open;$('modal').onclick=e=>{if(e.target.id==='modal')close()};$('date').onclick=()=>{let c=$('calendar');c.value=dateKey(selected);if(c.showPicker)c.showPicker();else c.click()};$('calendar').onchange=e=>{if(e.target.value)selectDate(parseKey(e.target.value))};$('todayBtn').onclick=()=>selectDate(new Date(D));$('prevBtn').onclick=()=>{let d=new Date(selected);d.setDate(d.getDate()-1);selectDate(d)};$('nextBtn').onclick=()=>{let d=new Date(selected);d.setDate(d.getDate()+1);selectDate(d)};render();
</script></body></html>
