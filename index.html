<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#090b10"><link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg"><link rel="apple-touch-icon" href="icon-192.png">
<title>DailyX</title>
<style>
:root{--bg:#090b10;--card:#12151c;--line:#252b36;--text:#f4f7fb;--muted:#8d96a6;--a:#9cff57;--warn:#ffcc66;--sel:#2c5871;--teal:#23d6a4}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 90% 0,#25321c,transparent 28%),radial-gradient(circle at 0 40%,#172033,transparent 30%),var(--bg);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,sans-serif}
button,input,select{font:inherit}.app{max-width:620px;margin:auto;padding:18px 17px 70px}
header{display:flex;justify-content:space-between;gap:10px;margin-bottom:16px}.brand{min-width:0;flex:1}.brandline{display:flex;align-items:baseline;gap:7px}
h1{font-size:30px;line-height:1;margin:0;font-weight:850}.version{font-size:10px;color:#59616e}.date{color:var(--muted);font-size:14px;margin-top:9px;cursor:pointer}.motivation{color:#727b8a;font-size:12px;margin-top:5px;font-style:italic}
.ha{display:flex;align-items:center;gap:8px}.streak{background:#171c17;border:1px solid #304028;color:#d8ffbf;border-radius:13px;padding:9px 10px;font-size:12px;font-weight:800;white-space:nowrap}.add{width:46px;height:46px;border:0;border-radius:15px;background:var(--a);font-size:28px}
.date-strip{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 12px;scrollbar-width:none}.date-strip::-webkit-scrollbar{display:none}.day-card{flex:0 0 78px;height:78px;background:#202a38;border:1px solid #344154;border-radius:18px;color:var(--text);display:flex;flex-direction:column;align-items:center;justify-content:center}.day-card.selected{background:var(--sel);border-color:var(--teal);box-shadow:0 0 0 1px var(--teal)}.dow{font-size:12px;color:#b8c0cd}.num{font-size:22px;font-weight:900;margin-top:4px}.date-tools{text-align:center;min-height:29px;margin:-1px 0 14px}.date-tools button{border:1px solid var(--line);background:#12151c;color:var(--muted);border-radius:10px;padding:6px 12px;font-size:11px}
.info-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:22px;margin-bottom:21px;align-items:stretch}.deadline-head{display:flex;justify-content:space-between;margin:0 2px 10px}.deadline-head strong{font-size:17px}.deadline-head span{font-size:12px;color:var(--muted)}
.deadline-list,.list{background:#12151ce8;border:1px solid var(--line);border-radius:20px;overflow:hidden}.deadline-item,.item{display:flex;align-items:center;gap:10px;padding:14px 11px;border-bottom:1px solid var(--line)}.deadline-item:last-child,.item:last-child{border:0}
.deadline-dot{width:21px;height:21px;border-radius:50%;background:var(--warn);box-shadow:0 0 0 7px #ffcc6614;flex:none}.deadline-body,.body{min-width:0;flex:1}.deadline-title,.title{font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.deadline-time,.time{font-size:11px;color:var(--muted);margin-top:4px}.deadline-more,.more{border:0;background:transparent;color:#7f8794;font-size:23px;padding:5px}
.deadline-empty,.empty{text-align:center;color:var(--muted);padding:22px 12px}.deadline-empty b,.empty b{color:var(--text)}
.progress{background:linear-gradient(145deg,#151922,#0f1218);border:1px solid var(--line);border-radius:20px;padding:17px;display:flex;align-items:flex-end}.label{color:var(--muted);font-size:13px}.pct{font-size:38px;font-weight:900;margin-top:6px}.progress-bar{height:7px;background:#222832;border-radius:99px;margin-top:13px;overflow:hidden}.progress-fill{height:100%;background:var(--a);width:0%;transition:.25s}
.dh{display:flex;justify-content:space-between;margin:4px 2px 10px}.dh strong{font-size:17px}.dh span{font-size:12px;color:var(--muted)}.check{width:25px;height:25px;border:2px solid #4d5665;border-radius:8px;flex:none}.done .check{background:var(--a);border-color:var(--a)}.done .check:after{content:'✓';display:block;text-align:center;color:#071006;font-weight:900}.done .title{text-decoration:line-through;opacity:.55}.body{cursor:pointer}
.hint{text-align:center;color:#667181;font-size:11px;margin-top:11px}.footer{text-align:center;color:#5f6877;font-size:11px;margin-top:42px}.footer b{color:#778293}
.modal{position:fixed;inset:0;background:#000b;display:none;align-items:flex-end;padding:10px;z-index:5}.modal.show{display:flex}.sheet{width:min(620px,100%);margin:auto;background:#12151c;border:1px solid #2a303b;border-radius:24px;padding:20px;max-height:88vh;overflow:auto}.sheet h2{margin:0 0 15px}.choice{display:flex;gap:10px;flex-wrap:wrap}.choice button,.actions button,.menu button{width:100%;padding:14px;border-radius:13px;font-weight:800}.choice button{background:#191d25;color:var(--text);border:1px solid var(--line);flex:1 1 calc(50% - 5px)}.choice button:last-child{flex-basis:100%}label{display:block;color:var(--muted);font-size:12px;font-weight:750;margin-top:10px}input,select{width:100%;padding:13px;margin-top:6px;background:#0d1015;color:var(--text);border:1px solid #303744;border-radius:12px}.row{display:flex;gap:10px}.row>div{flex:1}.actions{display:flex;gap:10px;margin-top:16px}.primary{background:var(--a);color:#081006;border:0}.secondary{background:#191d25;color:var(--text);border:1px solid #303744}.small{color:var(--muted);font-size:11px;margin-top:8px}.menu{display:grid;gap:9px}.menu button{border:1px solid var(--line);background:#191d25;color:var(--text);text-align:left}.menu .delete{color:#ff9f9f}.calendar-input{position:absolute;opacity:0;pointer-events:none;width:1px;height:1px}
@media(max-width:430px){.info-grid{gap:10px}.streak{padding:8px;font-size:11px}.pct{font-size:34px}}
</style></head><body>
<div class="app"><header><div class="brand"><div class="brandline"><h1>DailyX</h1><span class="version">v1.1</span></div><div class="date" id="date"></div><div class="motivation" id="motivation"></div></div><div class="ha"><div class="streak">🔥 <span id="streak">0</span> day streak</div><button class="add" id="add">+</button></div></header>
<input class="calendar-input" id="calendar" type="date"><div class="date-strip" id="dateStrip"></div><div class="date-tools"><button id="todayBtn">Today</button></div>
<div class="info-grid"><section class="deadlines"><div class="deadline-head"><strong>Deadlines</strong><span id="deadlineCount"></span></div><div class="deadline-list" id="deadlineList"></div></section><section class="progress"><div style="width:100%"><div class="label">Progress</div><div class="pct" id="pct">0%</div><div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div></div></section></div>
<div class="dh"><strong id="day"></strong><span id="n"></span></div><div class="list" id="list"></div><div class="hint">Weekly tasks repeat automatically. Changes can be made for one date or for every week.</div><div class="footer">Made by <b>AyushXO</b> 😅</div></div>
<div class="modal" id="modal"><div class="sheet" id="sheet"></div></div>
<script>
const K='routineV3',W=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];let D=new Date();D.setHours(0,0,0,0);let selected=new Date(D);let S=JSON.parse(localStorage.getItem(K)||'null')||{tasks:[],done:{},deadlines:[]};S.tasks??=[];S.done??={};S.deadlines??=[];
const $=id=>document.getElementById(id),esc=x=>String(x).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));function pad(n){return String(n).padStart(2,'0')}function key(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}function parse(k){let[a,b,c]=k.split('-').map(Number),d=new Date(a,b-1,c);d.setHours(0,0,0,0);return d}function same(a,b){return key(a)==key(b)}function save(){localStorage.setItem(K,JSON.stringify(S))}function tm(v){if(!v)return'';let[h,m]=v.split(':').map(Number);return(h%12||12)+':'+pad(m)+' '+(h>=12?'PM':'AM')}function fd(k){return new Intl.DateTimeFormat('en-IN',{day:'numeric',month:'short',year:'numeric'}).format(parse(k))}
function done(id){return!!S.done[key(selected)]?.[id]}function toggle(id){let k=key(selected);S.done[k]??={};S.done[k][id]=!S.done[k][id];save();render()}function close(){$('modal').classList.remove('show')}
function openAdd(){$('sheet').innerHTML='<h2>Add something</h2><div class="choice"><button onclick="taskForm()">＋ Routine task</button><button onclick="deadlineForm()">＋ Deadline</button><button onclick="copyForm()">＋ Copy tasks</button></div><div class="actions"><button class="secondary" onclick="close()">Cancel</button></div>';$('modal').classList.add('show')}
function copyForm(){$('sheet').innerHTML=`<h2>Copy tasks</h2><div class="small">Copy all weekly tasks from one weekday to another. Names, times and repeat settings stay the same.</div><div class="row"><div><label>From</label><select id="cf">${W.slice(1).map((x,i)=>`<option value="${i+1}">${x}</option>`).join('')}<option value="0">Sunday</option></select></div><div><label>To</label><select id="ct">${W.slice(1).map((x,i)=>`<option value="${i+1}">${x}</option>`).join('')}<option value="0">Sunday</option></select></div></div><div id="cp" class="small"></div><div class="actions"><button class="secondary" onclick="close()">Cancel</button><button class="primary" onclick="copyTasks()">Copy</button></div>`;$('cf').value=selected.getDay();$('ct').value=(selected.getDay()+1)%7;updCopy();$('cf').onchange=updCopy;$('ct').onchange=updCopy;$('modal').classList.add('show')}
function updCopy(){let a=+$('cf').value,b=+$('ct').value,n=S.tasks.filter(t=>t.repeat&&!t.date&&t.weekday==a).length;$('cp').textContent=a==b?'Choose two different days.':`${n} weekly task${n==1?'':'s'} will be copied from ${W[a]} to ${W[b]}.`}
function copyTasks(){let a=+$('cf').value,b=+$('ct').value;if(a==b)return;S.tasks.filter(t=>t.repeat&&!t.date&&t.weekday==a).forEach(t=>{if(!S.tasks.some(x=>x.repeat&&!x.date&&x.weekday==b&&x.title==t.title&&x.start==t.start&&x.end==t.end))S.tasks.push({id:'t'+Date.now()+Math.random(),title:t.title,start:t.start||'',end:t.end||'',weekday:b,repeat:true,order:t.order??Date.now()})});save();close();render()}
function taskForm(id=''){let t=S.tasks.find(x=>x.id==id);$('sheet').innerHTML=`<h2>${t?'Edit':'Add'} routine task</h2><label>What do you need to do?</label><input id="name" value="${t?esc(t.title):''}" placeholder="e.g. Study"><div class="row"><div><label>Start</label><input id="st" type="time" value="${t?.start||''}"></div><div><label>End</label><input id="en" type="time" value="${t?.end||''}"></div></div><label>Save for</label><select id="scope"><option value="date">This date only — ${fd(key(selected))}</option><option value="week">Every ${W[selected.getDay()]} — repeat weekly</option></select><div class="actions"><button class="secondary" onclick="close()">Cancel</button><button class="primary" onclick="saveTask('${id}')">Save</button></div>`;$('modal').classList.add('show')}
function saveTask(id){let title=$('name').value.trim();if(!title)return;let start=$('st').value,end=$('en').value,scope=$('scope').value,k=key(selected),old=S.tasks.find(x=>x.id==id);if(id&&old&&old.repeat&&!old.date&&scope=='date')S.tasks.push({id:'t'+Date.now(),title,start,end,weekday:selected.getDay(),repeat:false,order:Date.now(),date:k,source:id});else if(id)Object.assign(old,{title,start,end,weekday:selected.getDay(),repeat:scope=='week',date:scope=='week'?null:k});else S.tasks.push({id:'t'+Date.now(),title,start,end,weekday:selected.getDay(),repeat:scope=='week',order:Date.now(),date:scope=='week'?null:k});save();close();render()}
function deadlineForm(id=''){let d=S.deadlines.find(x=>x.id==id);$('sheet').innerHTML=`<h2>${d?'Edit':'Add'} deadline</h2><label>Deadline for</label><input id="dn" value="${d?esc(d.title):''}" placeholder="e.g. Submit assignment"><div class="row"><div><label>Date</label><input id="dd" type="date" value="${d?.date||key(selected)}"></div><div><label>Time</label><input id="dt" type="time" value="${d?.time||'23:59'}"></div></div><div class="actions"><button class="secondary" onclick="close()">Cancel</button><button class="primary" onclick="saveDeadline('${id}')">Save</button></div>`;$('modal').classList.add('show')}
function saveDeadline(id){let title=$('dn').value.trim();if(!title)return;let o={title,date:$('dd').value,time:$('dt').value};if(id)Object.assign(S.deadlines.find(x=>x.id==id),o);else S.deadlines.push({id:'d'+Date.now(),...o});save();close();render()}
function menu(type,id){$('sheet').innerHTML=`<h2>${type=='task'?'Routine task':'Deadline'}</h2><div class="menu"><button onclick="close();${type=='task'?'taskForm':'deadlineForm'}('${id}')">✎ Edit</button><button class="delete" onclick="${type=='task'?'delTask':'delDeadline'}('${id}')">⌫ Delete</button><button class="secondary" onclick="close()">Cancel</button></div>`;$('modal').classList.add('show')}
function delTask(id){S.tasks=S.tasks.filter(x=>x.id!=id);save();close();render()}function delDeadline(id){S.deadlines=S.deadlines.filter(x=>x.id!=id);save();close();render()}
function visible(){let k=key(selected);return S.tasks.filter(t=>(t.repeat&&!t.date&&t.weekday==selected.getDay())||t.date==k)}
function strip(){let a=[];for(let i=-3;i<=3;i++){let d=new Date(selected);d.setDate(d.getDate()+i);a.push(d)}$('dateStrip').innerHTML=a.map(d=>`<button class="day-card ${same(d,selected)?'selected':''}" onclick="selected=parse('${key(d)}');render()"><span class="dow">${W[d.getDay()].slice(0,3).toUpperCase()}</span><span class="num">${d.getDate()}</span></button>`).join('')}
function deadlines(){let k=key(D),ds=S.deadlines.filter(x=>x.date>=k).sort((a,b)=>(a.date+(a.time||'99:99')).localeCompare(b.date+(b.time||'99:99')));$('deadlineCount').textContent=ds.length?ds.length+' upcoming':'';$('deadlineList').innerHTML=ds.length?ds.map(d=>`<div class="deadline-item"><div class="deadline-dot"></div><div class="deadline-body" onclick="deadlineForm('${d.id}')"><div class="deadline-title">${esc(d.title)}</div><div class="deadline-time">${fd(d.date)}${d.time?' · '+tm(d.time):''}</div></div><button class="deadline-more" onclick="menu('deadline','${d.id}')">⋮</button></div>`).join(''):'<div class="deadline-empty"><b>No upcoming deadlines</b> · Tap + to add one</div>'}
const MOT=['Win the day, one task at a time.','Small progress is still progress.','Discipline beats motivation when motivation fades.','Your future self is built by what you do today.','Focus on the next step, not the whole staircase.','Do it now. Make tomorrow easier.','Consistency turns ordinary effort into extraordinary results.'];
function render(){let k=key(selected);$('date').textContent=new Intl.DateTimeFormat('en-IN',{weekday:'long',month:'long',day:'numeric',year:'numeric'}).format(selected);$('motivation').textContent=MOT[((Math.floor(selected.getTime()/86400000)%MOT.length)+MOT.length)%MOT.length];$('todayBtn').style.display=same(selected,D)?'none':'inline-block';$('day').textContent=W[selected.getDay()];strip();deadlines();let ts=visible();$('n').textContent=ts.length+' routine'+(ts.length==1?'':'s');$('list').innerHTML=ts.length?ts.sort((a,b)=>(a.start||'99:99').localeCompare(b.start||'99:99')).map(t=>`<div class="item ${done(t.id)?'done':''}"><div class="check" onclick="toggle('${t.id}')"></div><div class="body" onclick="taskForm('${t.id}')"><div class="title">${esc(t.title)}</div><div class="time">${tm(t.start)}${t.end?' to '+tm(t.end):''}${t.date&&!t.repeat?' · This date only':''}</div></div><button class="more" onclick="menu('task','${t.id}')">⋮</button></div>`).join(''):'<div class="empty"><b>No routine yet</b>Tap + to add your first task.</div>';let c=ts.filter(t=>done(t.id)).length,p=ts.length?Math.round(c/ts.length*100):0;$('pct').textContent=p+'%';$('progressFill').style.width=p+'%';$('streak').textContent=streak();save()}
function streak(){let n=0,d=new Date(D);for(let i=0;i<366;i++){let k=key(d),ts=S.tasks.filter(t=>(t.repeat&&!t.date&&t.weekday==d.getDay())||t.date==k);if(!ts.length||!ts.every(t=>S.done[k]?.[t.id]))break;n++;d.setDate(d.getDate()-1)}return n}
$('add').onclick=openAdd;$('modal').onclick=e=>{if(e.target.id=='modal')close()};$('date').onclick=()=>{let c=$('calendar');c.value=key(selected);c.showPicker?c.showPicker():c.click()};$('calendar').onchange=e=>{if(e.target.value){selected=parse(e.target.value);render()}};$('todayBtn').onclick=()=>{selected=new Date(D);render()};if('serviceWorker'in navigator)addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));render();
</script></body></html>
