<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#090b10"><title>Daily Routine</title><style>
:root{--bg:#090b10;--card:#12151c;--line:#252b36;--text:#f4f7fb;--muted:#8d96a6;--a:#9cff57}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 90% 0,#25321c,transparent 28%),radial-gradient(circle at 0 40%,#172033,transparent 30%),var(--bg);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,sans-serif}.app{max-width:620px;margin:auto;padding:22px 17px 70px}header{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:20px}h1{font-size:29px;margin:0}.date{color:var(--muted);font-size:14px;margin-top:4px}.ha{display:flex;align-items:center;gap:8px}.streak{background:#171c17;border:1px solid #304028;color:#d8ffbf;border-radius:13px;padding:9px 10px;font-size:12px;font-weight:800;white-space:nowrap}.add{width:46px;height:46px;border:0;border-radius:15px;background:var(--a);color:#081006;font-size:28px;cursor:pointer}.progress{background:linear-gradient(145deg,#151922,#0f1218);border:1px solid var(--line);border-radius:20px;padding:17px;margin-bottom:21px}.pr{display:flex;justify-content:space-between;align-items:end}.label,.count{color:var(--muted);font-size:13px}.pct{font-size:31px;font-weight:900}.bar{height:9px;background:#252a34;border-radius:99px;overflow:hidden;margin-top:12px}.fill{height:100%;width:0;background:var(--a);transition:.25s}.dh{display:flex;justify-content:space-between;margin:4px 2px 10px}.dh strong{font-size:17px}.dh span{font-size:12px;color:var(--muted)}.list{background:#12151ce8;border:1px solid var(--line);border-radius:20px;overflow:hidden}.item{display:flex;align-items:center;gap:12px;padding:15px 13px;border-bottom:1px solid var(--line)}.item:last-child{border:0}.check{width:25px;height:25px;border:2px solid #4d5665;border-radius:8px;flex:none;cursor:pointer}.done .check{background:var(--a);border-color:var(--a)}.done .check:after{content:'✓';display:block;text-align:center;color:#071006;font-weight:900}.body{flex:1;min-width:0;cursor:pointer}.title{font-size:15px;font-weight:750;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.time{font-size:12px;color:var(--muted);margin-top:3px}.more{border:0;background:none;color:#8b94a2;font-size:22px;cursor:pointer}.empty{text-align:center;padding:35px 20px;color:var(--muted)}.empty b{display:block;color:var(--text);margin-bottom:6px}.hint{text-align:center;color:#667181;font-size:11px;margin-top:11px}.modal{position:fixed;inset:0;background:#000b;display:none;align-items:flex-end;padding:10px;z-index:5}.modal.show{display:flex}.sheet{width:min(620px,100%);margin:auto;background:#12151c;border:1px solid #2a303b;border-radius:24px;padding:20px}.sheet h2{margin:0 0 15px}.choice{display:flex;gap:10px}.choice button,.actions button{flex:1;padding:14px;border-radius:13px;font-weight:800;cursor:pointer}.choice button{background:#191d25;color:var(--text);border:1px solid var(--line)}label{display:block;color:var(--muted);font-size:12px;font-weight:750;margin-top:10px}input,select{width:100%;padding:13px;margin-top:6px;background:#0d1015;color:var(--text);border:1px solid #303744;border-radius:12px;font:inherit}.row{display:flex;gap:10px}.row>div{flex:1}.actions{display:flex;gap:10px;margin-top:16px}.primary{background:var(--a);color:#081006;border:0}.secondary{background:#191d25;color:var(--text);border:1px solid #303744}.small{color:var(--muted);font-size:11px;margin-top:8px}
</style></head><body><div class="app"><header><div><h1>Daily Routine</h1><div class="date" id="date"></div></div><div class="ha"><div class="streak">🔥 <span id="streak">0</span> day streak</div><button class="add" id="add">+</button></div></header><section class="progress"><div class="pr"><div><div class="label">Today's Progress</div><div class="pct" id="pct">0%</div></div><div class="count" id="count">0/0 completed</div></div><div class="bar"><div class="fill" id="fill"></div></div></section><div class="dh"><strong id="day"></strong><span id="n"></span></div><div class="list" id="list"></div><div class="hint">Routine tasks repeat every week unless you choose “Today only”.</div></div><div class="modal" id="modal"><div class="sheet" id="sheet"></div></div>
<script>
const K='routineV3',oldK='dailyRoutineV1',W=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];let D=new Date(),key=new Date(D.getFullYear(),D.getMonth(),D.getDate()).toISOString().slice(0,10),wd=D.getDay();let S=JSON.parse(localStorage.getItem(K)||'null');if(!S){let o=JSON.parse(localStorage.getItem(oldK)||'null');S={tasks:[],done:{},deadlines:[]};if(o?.tasks)S.tasks=o.tasks.map((x,i)=>({id:'old'+x.id,title:x.name,start:x.time||'',end:'',weekday:3,repeat:true,order:i}));}S.tasks??=[];S.done??={};S.deadlines??=[];const $=id=>document.getElementById(id),esc=x=>String(x).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));function save(){localStorage.setItem(K,JSON.stringify(S))}function done(id){return !!S.done[key]?.[id]}function toggle(id){S.done[key]??={};S.done[key][id]=!S.done[key][id];save();render()}function close(){ $('modal').classList.remove('show')}function open(){ $('sheet').innerHTML='<h2>Add something</h2><div class="choice"><button onclick="taskForm()">＋ Routine task</button><button onclick="deadlineForm()">＋ Deadline</button></div><div class="actions"><button class="secondary" onclick="close()">Cancel</button></div>';$('modal').classList.add('show')}
function taskForm(id=''){let t=S.tasks.find(x=>x.id===id);$('sheet').innerHTML=`<h2>${t?'Edit':'Add'} routine task</h2><label>What do you need to do?</label><input id="name" value="${t?esc(t.title):''}" placeholder="e.g. Study"><div class="row"><div><label>Start</label><input id="start" type="time" value="${t?.start||''}"></div><div><label>End</label><input id="end" type="time" value="${t?.end||''}"></div></div><label>Repeat weekly</label><select id="repeat"><option value="1" ${!t||t.repeat?'selected':''}>Yes — every ${W[wd]}</option><option value="0" ${t&&!t.repeat?'selected':''}>No — today only</option></select><div class="small">Tap a task to edit it later.</div><div class="actions"><button class="secondary" onclick="close()">Cancel</button><button class="primary" onclick="saveTask('${id}')">Save</button></div>`;$('modal').classList.add('show')}
function saveTask(id){let title=$('name').value.trim();if(!title)return;let o={title,start:$('start').value,end:$('end').value,weekday:wd,repeat:$('repeat').value==='1',order:Date.now()};if(id)Object.assign(S.tasks.find(x=>x.id===id),o);else S.tasks.push({id:'t'+Date.now(),...o});save();close();render()}
function deadlineForm(id=''){let d=S.deadlines.find(x=>x.id===id);$('sheet').innerHTML=`<h2>${d?'Edit':'Add'} deadline</h2><label>Deadline for</label><input id="dn" value="${d?esc(d.title):''}" placeholder="e.g. Submit assignment"><div class="row"><div><label>Date</label><input id="dd" type="date" value="${d?.date||key}"></div><div><label>Time</label><input id="dt" type="time" value="${d?.time||'23:59'}"></div></div><div class="actions"><button class="secondary" onclick="close()">Cancel</button><button class="primary" onclick="saveDeadline('${id}')">Save</button></div>`;$('modal').classList.add('show')}
function saveDeadline(id){let title=$('dn').value.trim();if(!title)return;let o={title,date:$('dd').value,time:$('dt').value};if(id)Object.assign(S.deadlines.find(x=>x.id===id),o);else S.deadlines.push({id:'d'+Date.now(),...o});save();close();render()}
function delTask(id){if(confirm('Delete this routine task?')){S.tasks=S.tasks.filter(x=>x.id!==id);save();render()}}function delDeadline(id){if(confirm('Delete this deadline?')){S.deadlines=S.deadlines.filter(x=>x.id!==id);save();render()}}
function streak(){let n=0,d=new Date();for(let i=0;i<366;i++){let k=new Date(d.getFullYear(),d.getMonth(),d.getDate()).toISOString().slice(0,10),ts=S.tasks.filter(t=>t.weekday===d.getDay());if(!ts.length||!ts.every(t=>S.done[k]?.[t.id]))break;n++;d.setDate(d.getDate()-1)}return n}
function render(){$('date').textContent=new Intl.DateTimeFormat('en-IN',{weekday:'long',month:'long',day:'numeric',year:'numeric'}).format(D);$('day').textContent=W[wd];let ts=S.tasks.filter(t=>t.weekday===wd),ds=S.deadlines.filter(d=>d.date===key),arr=[];ts.forEach(t=>arr.push({k:'t',s:t.start||'99:99',x:t}));ds.forEach(d=>arr.push({k:'d',s:d.time||'99:99',x:d}));arr.sort((a,b)=>a.s.localeCompare(b.s));$('n').textContent=ts.length+' routine'+(ts.length===1?'':'s');$('list').innerHTML='';if(!arr.length)$('list').innerHTML='<div class="empty"><b>No routine yet</b>Tap + to add your first task or deadline.</div>';arr.forEach(a=>{let x=a.x,r=document.createElement('div');r.className='item '+(a.k==='t'&&done(x.id)?'done':'');if(a.k==='t'){r.innerHTML=`<div class="check"></div><div class="body"><div class="title">${esc(x.title)}</div><div class="time">${x.start||''}${x.end?' to '+x.end:''}${x.repeat?'':' · Today only'}</div></div><button class="more">⋮</button>`;r.querySelector('.check').onclick=()=>toggle(x.id);r.querySelector('.body').onclick=()=>taskForm(x.id);r.querySelector('.more').onclick=()=>delTask(x.id)}else{r.innerHTML=`<div class="check" style="border-radius:50%"></div><div class="body"><div class="title">⏰ ${esc(x.title)}</div><div class="time">Deadline · ${esc(x.date)} ${esc(x.time)}</div></div><button class="more">⋮</button>`;r.querySelector('.body').onclick=()=>deadlineForm(x.id);r.querySelector('.more').onclick=()=>delDeadline(x.id)}$('list').appendChild(r)});let c=ts.filter(t=>done(t.id)).length,p=ts.length?Math.round(c/ts.length*100):0;$('pct').textContent=p+'%';$('count').textContent=c+'/'+ts.length+' completed';$('fill').style.width=p+'%';$('streak').textContent=streak();save()}$('add').onclick=open;$('modal').onclick=e=>{if(e.target.id==='modal')close()};render();
</script></body></html>
